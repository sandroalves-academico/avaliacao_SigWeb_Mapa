<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaflet + Supabase PostGIS - Camadas Independentes</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.css" />

    <style>
        * { box-sizing: border-box; }
        body { padding: 0; margin: 0; font-family: sans-serif; overflow: hidden; }
        html, body, #map { height: 100%; width: 100vw; }

        /* Loading overlay */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 14px;
            transition: opacity 0.4s;
        }
        #loading-overlay.hidden { opacity: 0; pointer-events: none; }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e0e0e0;
            border-top-color: #0d6efd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-overlay p { margin: 0; font-size: 15px; color: #444; }

        /* Error toast */
        #error-box {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #dc3545;
            color: #fff;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }

        /* Coordenadas do Cursor */
        #coords-monitor {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            pointer-events: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        /* Botão Enquadrar Paraíba */
        .leaflet-control-fit-bounds {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            background-clip: padding-box;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2) !important;
        }
        .leaflet-control-fit-bounds:hover { background-color: #f4f4f4; }
        .leaflet-control-fit-bounds svg { width: 18px; height: 18px; fill: #555; }

        /* Ajustes de CSS para o Controle de Localização */
        .leaflet-control-locate {
            margin-top: 5px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2) !important;
            border: 2px solid rgba(0,0,0,0.2) !important;
            background: #fff !important;
            border-radius: 4px !important;
        }
        .leaflet-control-locate a {
            width: 30px !important;
            height: 30px !important;
            line-height: 30px !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            color: #555 !important;
        }
        .leaflet-control-locate.active a {
            color: #136AEC !important;
        }

        /* Seletor de Variável */
        .control-seletor-variavel {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            border: 2px solid rgba(0,0,0,0.2);
            max-width: 280px;
        }
        .control-seletor-variavel label {
            font-size: 12px;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            color: #333;
        }
        .control-seletor-variavel select {
            padding: 4px 8px;
            font-size: 13px;
            border-radius: 4px;
            border: 1px solid #ccc;
            outline: none;
            cursor: pointer;
            background-color: #fff;
            width: 100%;
        }

        /* Legenda Coroplética */
        .info.legend {
            background: white;
            padding: 10px 14px;
            font-family: sans-serif;
            font-size: 13px;
            line-height: 20px;
            color: #444;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            max-width: 220px;
            margin-bottom: 35px;
        }
        .info.legend h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #222;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }
        .info.legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.85;
            border: 1px solid rgba(0,0,0,0.15);
        }

        /* Estilização da Pesquisa */
        .leaflet-control-search {
            margin-top: 5px !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2) !important;
            border: 2px solid rgba(0,0,0,0.2) !important;
        }
        .leaflet-control-search .search-input {
            max-width: 160px;
        }

        /* Botão de Camadas */
        .leaflet-control-layers {
            margin-top: 5px !important; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.2) !important;
            border: 2px solid rgba(0,0,0,0.2) !important;
            border-radius: 4px !important;
            background: #fff;
        }
        .leaflet-control-layers-toggle {
            width: 30px !important;
            height: 30px !important;
            background-size: 20px 20px !important; 
        }
        .leaflet-control-layers-expanded {
            padding: 10px 14px !important;
            background: #fff !important;
            color: #333 !important;
            font-family: sans-serif !important;
            font-size: 13px !important;
            line-height: 1.5 !important;
            max-height: 220px;
            overflow-y: auto;
            border: none !important;
        }

        /* Customização Geral do Popup do Leaflet */
        .leaflet-popup-content-wrapper {
            padding: 0 !important;
            overflow: hidden;
            border-radius: 8px !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3) !important;
        }
        .leaflet-popup-content {
            margin: 0 !important;
            width: 280px !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
        .leaflet-popup-close-button {
            color: #ffffff !important;
            padding: 8px 8px 0 0 !important;
            font-size: 16px !important;
        }
        .leaflet-popup-close-button:hover {
            color: #cbd5e1 !important;
            background: transparent !important;
        }

        /* Regras de Responsividade Mobile */
        @media (max-width: 768px) {
            .leaflet-top.leaflet-left {
                margin: 10px 0 0 10px;
            }
            .leaflet-control-locate a {
                width: 26px !important;
                height: 26px !important;
                line-height: 26px !important;
            }
            #coords-monitor {
                font-size: 10px;
                padding: 4px 8px;
                bottom: 5px;
                right: 5px;
            }
            .info.legend {
                max-width: 160px;
                font-size: 11px;
                padding: 6px 10px;
                margin-bottom: 25px;
            }
            .control-seletor-variavel {
                max-width: 170px;
                padding: 6px 8px;
            }
            .leaflet-popup-content {
                width: 240px !important;
            }
        }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">Conectando ao banco de dados...</p>
</div>

<div id="error-box"></div>
<div id="coords-monitor">Lat: --.----, Lon: --.----</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="https://cdn.jsdelivr.net/npm/leaflet-search@3.0.9/dist/leaflet-search.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.js"></script>

<script>
// ============================================================
//  CONFIGURAÇÃO DO SUPABASE
// ============================================================
const SUPABASE_URL = 'https://lncyagmuslclqykpmrrb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuY3lhZ211c2xjbHF5a3BtcnJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMTczNDMsImV4cCI6MjA5MzY5MzM0M30.D2zTJGZHmm6N6rvnzC5Bdsqgvmg0G41TrcG2B-KJjEo';

const COLUNA_GEOM = 'geom';
let variavelAtual = 'populacao_total'; 

// ============================================================
//  MAPA BASE E CONFIGURAÇÕES INICIAIS
// ============================================================
const center = [-7.213987593255963, -36.99096679687501];
const zoom   = 8;
const map    = L.map('map', { tap: false }).setView(center, zoom);

const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const googleStreets = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains: ['mt0','mt1','mt2','mt3'],
    attribution: '&copy; Google Maps'
});

let camadaLimiteParaiba = null;
let camadaMunicipiosBase = null; // Nova camada apenas com limites comuns
let camadaCoropletico = null;    // Nova camada dedicada ao Coroplético
let controleLegenda = null;

// ============================================================
//  FUNÇÕES DE ESTILIZAÇÃO
// ============================================================
function getColor(pop) {
    return pop > 200000 ? '#800026' :
           pop > 100000 ? '#BD0026' :
           pop > 50000  ? '#E31A1C' :
           pop > 20000  ? '#FC4E2A' :
           pop > 10000  ? '#FD8D3C' :
                          '#FFEDA0';
}

// Estilo do Mapa Coroplético (Colorido por indicador)
function estiloCoropletico(feature) {
    const valorPop = feature.properties[variavelAtual] ? Number(feature.properties[variavelAtual]) : 0;
    return {
        color: '#334155',
        weight: 1,
        opacity: 0.8,
        fillColor: getColor(valorPop),
        fillOpacity: 0.85
    };
}

// Estilo Padrão para os Municípios comuns (Sem preenchimento de dados)
const estiloMunicipiosBase = {
    color: 'red',
    weight: 1,
    opacity: 0.7,
    fillColor: '#white',
    fillOpacity: 0.2
};

const estiloLimitePB = { color: '#1a1a1a', weight: 3, opacity: 1, fillColor: 'transparent', fillOpacity: 0 };
const estiloMalhaViaria = { color: '#34495e', weight: 1.2, opacity: 0.6 };

/* ── FUNÇÃO DE POPUP EM CARD ── */
function popupMunicipios(feature, layer) {
    if (feature.properties) {
        const p = feature.properties;
        
        const popTotal   = p.populacao_total   ? Number(p.populacao_total).toLocaleString('pt-BR') : '0';
        const popUrbana  = p.populacao_urbana  ? Number(p.populacao_urbana).toLocaleString('pt-BR') : '0';
        const popRural   = p.populacao_rural   ? Number(p.populacao_rural).toLocaleString('pt-BR') : '0';

        layer.bindPopup(`
            <div style="background: #ffffff; border-radius: 8px; overflow: hidden;">
                <div style="background: #1e293b; color: #ffffff; padding: 12px 14px; font-weight: 600; font-size: 14px; letter-spacing: 0.3px;">
                    📍 ${p.nome || 'Sem nome'}
                </div>
                <div style="padding: 14px; font-size: 12px; color: #334155; line-height: 1.6;">
                    <div style="margin-bottom: 12px;">
                        <div style="display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #e2e8f0;">
                            <span style="color: #64748b; font-weight: 500;">Código IBGE:</span>
                            <strong style="color: #0f172a;">${p.cod_ibge_m || 'N/A'}</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #e2e8f0;">
                            <span style="color: #64748b; font-weight: 500;">Microrregião:</span>
                            <strong style="color: #0f172a; text-align: right; max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.microregiao || 'N/A'}</strong>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 3px 0;">
                            <span style="color: #64748b; font-weight: 500;">Mesorregião:</span>
                            <strong style="color: #0f172a; text-align: right; max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.mesoregiao || 'N/A'}</strong>
                        </div>
                    </div>
                    <div style="font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px 0; padding-bottom: 3px; border-bottom: 2px solid #cbd5e1;">
                        📊 Dados Demográficos
                    </div>
                    <div>
                        <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f1f5f9;">
                            <span style="color: #475569;">🏢 Urbana:</span>
                            <span style="font-weight: 600; color: #1e293b;">${popUrbana}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f1f5f9;">
                            <span style="color: #475569;">🚜 Rural:</span>
                            <span style="font-weight: 600; color: #1e293b;">${popRural}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 6px 8px; margin-top: 4px; background: #f8fafc; border-radius: 4px;">
                            <span style="color: #0f172a; font-weight: 700;">👥 População Total:</span>
                            <span style="font-weight: 800; color: #2563eb; font-size: 13px;">${popTotal}</span>
                        </div>
                    </div>
                </div>
            </div>
        `, { maxWidth: 300 });
    }
}

// Coordenadas do Cursor
const coordsMonitor = document.getElementById('coords-monitor');
map.on('mousemove', function(e) {
    coordsMonitor.textContent = `Lat: ${e.latlng.lat.toFixed(5)}, Lon: ${e.latlng.lng.toFixed(5)}`;
});

L.control.scale({ metric: true, imperial: true, position: 'bottomleft' }).addTo(map);

// Botão Fit Bounds
const BotaoFitBounds = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function() {
        const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-fit-bounds');
        container.title = "Enquadrar Paraíba";
        container.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 4h6V2H4c-1.1 0-2 .9-2 2v6h2V4zm16 6h2V4c0-1.1-.9-2-2-2h-6v2h6v6zm-2 10h-6v2h6c1.1 0 2-.9 2-2v6h-2v-6zM4 14H2v6c0 1.1.9 2 2 2h6v-2H4v-6zm8-4c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z"/></svg>`;
        container.onclick = function() {
            if (camadaLimiteParaiba && map.hasLayer(camadaLimiteParaiba)) {
                map.fitBounds(camadaLimiteParaiba.getBounds());
            } else if (camadaMunicipiosBase) {
                map.fitBounds(camadaMunicipiosBase.getBounds());
            }
        };
        return container;
    }
});
map.addControl(new BotaoFitBounds());

// Gerenciador da Legenda Coroplética
function gerenciarLegendaVisivel() {
    if (camadaCoropletico && map.hasLayer(camadaCoropletico)) {
        if (!controleLegenda) {
            controleLegenda = L.control({ position: 'bottomright' });
            controleLegenda.onAdd = function () {
                const div = L.DomUtil.create('div', 'info legend');
                const grades = [0, 10000, 20000, 50000, 100000, 200000];
                const titulos = {
                    'populacao_total': 'População Total',
                    'populacao_urbana': 'População Urbana',
                    'populacao_rural': 'População Rural'
                };
                div.innerHTML = `<h4>${titulos[variavelAtual]}</h4>`;
                for (let i = 0; i < grades.length; i++) {
                    const de = grades[i];
                    const ate = grades[i + 1];
                    div.innerHTML += `<i style="background: ${getColor(de + 1)}"></i> ${de.toLocaleString('pt-BR')}${ate ? ` &ndash; ${ate.toLocaleString('pt-BR')}` : '+'}<br>`;
                }
                return div;
            };
            controleLegenda.addTo(map);
        }
    } else {
        if (controleLegenda) {
            map.removeControl(controleLegenda);
            controleLegenda = null;
        }
    }
}

// Seletor de Variáveis do Filtro populacional
const ControlSeletorFiltro = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function() {
        const seletorDiv = L.DomUtil.create('div', 'control-seletor-variavel');
        seletorDiv.innerHTML = `
            <label for="campo-populacao">Filtrar Indicador:</label>
            <select id="campo-populacao">
                <option value="populacao_total" ${variavelAtual === 'populacao_total' ? 'selected' : ''}>População Total</option>
                <option value="populacao_urbana" ${variavelAtual === 'populacao_urbana' ? 'selected' : ''}>População Urbana</option>
                <option value="populacao_rural" ${variavelAtual === 'populacao_rural' ? 'selected' : ''}>População Rural</option>
            </select>
        `;
        L.DomEvent.disableClickPropagation(seletorDiv);
        L.DomEvent.disableScrollPropagation(seletorDiv);

        const select = seletorDiv.querySelector('select');
        select.addEventListener('change', function (e) {
            variavelAtual = e.target.value;
            if (camadaCoropletico) { 
                camadaCoropletico.setStyle(estiloCoropletico); 
                if(map.hasLayer(camadaCoropletico)) {
                    map.removeControl(controleLegenda);
                    controleLegenda = null;
                    gerenciarLegendaVisivel();
                }
            }
        });
        return seletorDiv;
    }
});
map.addControl(new ControlSeletorFiltro());

// Monitorar inserção/remoção da camada coroplética para ocultar/exibir a legenda dinamicamente
map.on('layeradd layerremove', function() {
    gerenciarLegendaVisivel();
});

// ============================================================
//  CONEXÃO DE DADOS COM SUPABASE
// ============================================================
async function buscarDadosSupabase(tabela) {
    let colunas = "*";
    if (tabela === 'municipios') {
        colunas = "nome,microregiao,mesoregiao,cod_ibge_m,populacao_total,populacao_urbana,populacao_rural,geom";
    }
    const response = await fetch(`${SUPABASE_URL}/rest/v1/${tabela}?select=${colunas}`, {
        headers: {
            'apikey':        SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Accept':        'application/json',
            'Range':         '0-9999' 
        }
    });
    if (!response.ok) {
        throw new Error(`[${tabela}] Erro na requisição HTTP ${response.status}`);
    }
    const rows = await response.json();
    return {
        type: 'FeatureCollection',
        features: rows.map(row => {
            const { [COLUNA_GEOM]: geom, ...props } = row;
            return { type: 'Feature', geometry: geom, properties: props };
        })
    };
}

// Inicializador Principal do Mapa
async function inicializarMapa() {
    const loadingEl   = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const errorEl     = document.getElementById('error-box');

    let geojsonLimitePB   = null;
    let geojsonViaria     = null;
    let geojsonSedes      = null;

    try {
        // 1. Limite Estadual
        loadingText.textContent = "Buscando limite estadual...";
        try {
            const data = await buscarDadosSupabase('limite_pb');
            geojsonLimitePB = L.geoJSON(data, { style: estiloLimitePB }).addTo(map);
            camadaLimiteParaiba = geojsonLimitePB;
        } catch (e) { console.warn("Camada 'limite_pb' indisponível.", e); }

        // 2. Municípios & Mapa Coroplético (Duas Camadas Geradas a partir do mesmo Dado)
        loadingText.textContent = "Carregando malhas geográficas e dados populacionais...";
        try {
            const dadosMunicipios = await buscarDadosSupabase('municipios');
            
            // Camada Base comum (apenas limites territoriais simples)
            camadaMunicipiosBase = L.geoJSON(dadosMunicipios, {
                style: estiloMunicipiosBase,
                onEachFeature: popupMunicipios
            }).addTo(map);

            // Camada Temática (Mapa Coroplético Ativo por padrão)
            camadaCoropletico = L.geoJSON(dadosMunicipios, {
                style: estiloCoropletico,
                onEachFeature: popupMunicipios
            }).addTo(map);

        } catch (e) { console.error("Falha ao processar municípios.", e); throw e; }

        // 3. Malha Viária
        try {
            const data = await buscarDadosSupabase('malha_viaria');
            geojsonViaria = L.geoJSON(data, { style: estiloMalhaViaria });
        } catch (e) { console.warn("Camada 'malha_viaria' indisponível.", e); }

        // 4. Sedes Urbanas
        try {
            const data = await buscarDadosSupabase('sedes');
            geojsonSedes = L.geoJSON(data, {
                pointToLayer: function(feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 4, fillColor: '#FF0000', color: '#000000', weight: 1, opacity: 1, fillOpacity: 0.9
                    });
                }
            });
        } catch (e) { console.warn("Camada 'sedes' indisponível.", e); }

        // ============================================================
        //  5. CONFIGURAÇÃO DE PLUGINS E CONTROLES DE CAMADAS
        // ============================================================
        
        // 5.1 ── LEAFLET SEARCH (Vinculado à camada base para buscas eficientes) ──
        const searchControl = new L.Control.Search({
            layer: camadaMunicipiosBase,
            propertyName: 'nome',
            marker: false,
            position: 'topleft',
            textPlaceholder: 'Buscar município...',
            textErr: 'Município não encontrado',
            initial: false,
            moveToLocation: function(latlng, title, map) {
                map.setView(latlng, 11);
            }
        });
        searchControl.on('search:locationfound', function(e) { e.layer.openPopup(); });
        map.addControl(searchControl);

        // 5.2 ── GERENCIADOR E SEPARADOR DE CAMADAS NO MENU ──
        const basemaps = { "OpenStreetMap": osm, "Google Streets": googleStreets };
        
        const overlays = {};
        if (geojsonLimitePB) overlays["Limite Estadual PB"] = geojsonLimitePB;
        if (camadaMunicipiosBase) overlays["Malha de Municípios (Linhas)"] = camadaMunicipiosBase;
        if (camadaCoropletico) overlays["Mapa Coroplético (População)"] = camadaCoropletico; // <- Separado aqui!
        if (geojsonViaria) overlays["Malha Viária"] = geojsonViaria;
        if (geojsonSedes) overlays["Sedes Urbanas"] = geojsonSedes;

        L.control.layers(basemaps, overlays, { position: 'topleft', collapsed: true }).addTo(map);

        // 5.3 ── CONTROL LOCATE ──
        L.control.locate({
            position: 'topleft', 
            strings: { title: "Mostrar minha localização atual", outside: "Fora dos limites." },
            flyTo: true, 
            keepCurrentZoomLevel: false,
            locateOptions: { enableHighAccuracy: true, timeout: 10000 }
        }).addTo(map);

        // Ativação Inicial da Legenda Dinâmica
        gerenciarLegendaVisivel();

        // Enquadramento Inicial da Câmera
        if (camadaLimiteParaiba) {
            map.fitBounds(camadaLimiteParaiba.getBounds());
        } else if (camadaMunicipiosBase) {
            map.fitBounds(camadaMunicipiosBase.getBounds());
        }

        loadingEl.classList.add('hidden');
    } catch (err) {
        console.error(err);
        loadingEl.classList.add('hidden');
        errorEl.textContent = `⚠️ Erro ao carregar dados: ${err.message}`;
        errorEl.style.display = 'block';
    }
}

inicializarMapa();
</script>

</html>
